<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cámara de registro 4D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Esqueleto fijo de la página. Los textos, la versión y los controles nuevos los pone el código (js/). -->
<h1 id="title">Cámara de registro</h1>
<div id="err" hidden></div>

<div class="box">
  <div class="vid">
    <video id="video" playsinline muted></video>
    <canvas id="ov"></canvas>
  </div>
  <div class="row">
    <button class="pri" id="bStart">Iniciar cámara</button>
    <button id="bEnd" disabled>Terminar</button>
    <button id="bNew" disabled>Nueva captura</button>
    <button id="bExp" disabled>Exportar JSON</button>
  </div>
  <div class="row">
    <button id="bRoi" disabled>Marcar objeto</button>
    <button id="bRoiClr" disabled>Borrar recuadro</button>
    <button id="bClean" class="on">Limpiar fondo: sí</button>
  </div>
  <!-- Controles que se agreguen en el futuro (los crea el código) -->
  <div class="row" id="controls"></div>
  <div class="prog"><div id="progBar"></div></div>
  <div id="progTxt"></div>
  <div id="status"></div>
  <div class="row">
    <label>Campo de visión (lado largo): <b id="fovV">65</b>°
      <input type="range" id="fov" min="35" max="120" value="65"></label>
    <label>Peso de la 4ª coordenada w: <b id="wsV">0.0</b>
      <input type="range" id="ws" min="0" max="2" step="0.05" value="0"></label>
  </div>
</div>

<div class="box">
  <canvas id="view"></canvas>
  <div class="row">
    <button id="m3" class="on">Arrastrar: 3D</button>
    <button id="m4">Arrastrar: 4D</button>
    <button id="bAuto">Rotación 4D auto</button>
  </div>
  <div class="row">
    <button id="zOut">Alejar −</button>
    <button id="zIn">Acercar +</button>
    <button id="zReset">Reiniciar vista</button>
  </div>
  <small id="help"></small>
</div>

<script>
// Panel de errores: muestra en pantalla cualquier error de JavaScript, incluso si los módulos no cargan.
(function () {
  function show(msg) {
    var el = document.getElementById('err');
    if (!el) return;
    el.hidden = false;
    el.textContent += (el.textContent ? '\n' : '') + msg;
  }
  window.showAppError = show;
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) { show('No se pudo cargar: ' + (t.src || t.href)); return; }
    show('Error: ' + (e.message || 'desconocido') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('Error: ' + ((e.reason && e.reason.message) || e.reason));
  });
  setTimeout(function () {
    if (!window.APP_READY) show('El programa no arrancó: algún archivo de js/ falta o es de otra versión.');
  }, 6000);
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
